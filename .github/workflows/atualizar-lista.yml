name: Atualizar lista do TSE

# Uso: Actions → "Atualizar lista do TSE" → Run workflow → cole o link do .csv.zip.
# O CDN do TSE abre normalmente daqui, mas o painel do SIG/TSE que mostra o link bloqueia os servidores do GitHub (403),
# então o link precisa vir de fora: cole-o aqui (dá para fazer pelo celular) ou use a rotina local (scripts/atualizar-tudo.mjs),
# que lê o painel sozinha no seu computador.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link do .csv.zip no CDN do TSE (cdn.tse.jus.br/.../secoes_eleitorais_alteradas_2t-pais_2026.csv.zip)'
        required: true

permissions:
  contents: write

concurrency:
  group: atualizar-lista
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      - name: Aplicar a lista (se for nova) e conferir os números
        id: aplicar
        env:
          URL_INFORMADA: ${{ github.event.inputs.url }}
        run: |
          node scripts/atualizar-lista.mjs "$URL_INFORMADA"
          npm run verificar

      - name: Enviar para o repositório (a Vercel publica sozinha)
        if: steps.aplicar.outputs.mudou == 'true'
        run: |
          git config user.name "atualizador-listas"
          git config user.email "actions@users.noreply.github.com"
          git add server/data
          git commit -m "Atualiza a lista do TSE: ${{ steps.aplicar.outputs.resumo }}"
          git push
